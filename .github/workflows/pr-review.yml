# 超大型 PR 的本地比对审查与 Issue 联动工作流 (v2)
#
# 触发方式：
#   1. pull_request (opened, synchronize, reopened, ready_for_review)
#   2. workflow_dispatch：支持手动指定 pr_number、max_chunks、link_issues 等参数进行测试。
#
# 在其他仓库中使用时，无需复制任何脚本或提示词文件，直接引用：
#   uses: devcxl/agentic-action/pr-review@main

name: PR Review (large diff)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '要审查的 PR 编号'
        required: true
      max_chunks:
        description: '本次最多审查的 chunk 数（0 = 不限）'
        required: false
        default: '0'
      link_issues:
        description: '是否启用关联 Issue 与 PR 类型联动 (true/false)'
        required: false
        default: 'true'
      include_issue_body:
        description: '是否将关联 Issue 正文导出至 contextDir/linked-issues (true/false)'
        required: false
        default: 'false'
      fail_on:
        description: '门禁级别 (none, low, medium, high, critical)'
        required: false
        default: 'high'

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  review:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout PR head (full history, no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Run Pi PR Review
        uses: ./pr-review
        with:
          provider: 'half-cabbage'
          model: 'deepseek-v4.1-flash'
          thinking: 'high'
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          max_chunks: ${{ inputs.max_chunks || '0' }}
          link_issues: ${{ inputs.link_issues || 'true' }}
          include_issue_body: ${{ inputs.include_issue_body || 'false' }}
          triage_config: '.github/triage.yml'
          exclude: '**/dist/**,**/vendor/**'
          fail_on: ${{ inputs.fail_on || 'high' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          typesafe_api_key: ${{ secrets.TYPESAFE_API_KEY }}
        env:
          HALF_CABBAGE_BASE_URL: ${{ secrets.HALF_CABBAGE_BASE_URL }}
          HALF_CABBAGE_API_KEY: ${{ secrets.HALF_CABBAGE_API_KEY }}
