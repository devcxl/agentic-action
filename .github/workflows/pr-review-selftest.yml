# v2 架构自检工作流：类型检查、dist 一致性校验与全套契约/单测

name: CI & Selftest

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'pr-review/**'
      - 'triage/**'
      - 'packages/**'
      - 'dist/**'
      - 'scripts/**'
      - 'pi-config/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/pr-review*.yml'
      - '.github/prompts/pr-review.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Verify dist/ bundle matches source
        run: pnpm build:check

      - name: Run Vitest unit & contract test suite
        run: pnpm test
