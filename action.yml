name: 'Pi Coding Agent Action'
description: 'Automated AI workflows and code tasks powered by Pi Coding Agent with full parameterization'
author: 'agentic-action'

inputs:
  # --- 提示词与任务指令 ---
  prompt:
    description: 'Main prompt or task message to execute (can be inline text or a file path)'
    required: true
  system_prompt:
    description: 'Override system prompt (can be inline text or a file path)'
    required: false
    default: ''
  append_system_prompt:
    description: 'Append text or file path to system prompt'
    required: false
    default: ''
  context_files:
    description: 'Space, comma, or newline-separated list of file paths to prepend with @ (e.g. "diff.patch doc.md")'
    required: false
    default: ''
  prompt_template:
    description: 'Path to a prompt template file or directory'
    required: false
    default: ''

  # --- 模型与 Provider 配置 ---
  model:
    description: 'Model identifier (e.g. gpt-4o, claude-3-7-sonnet, gemini-2.5-pro, or provider/model)'
    required: true
  provider:
    description: 'Provider name (e.g. half-cabbage, google, openai, anthropic)'
    required: false
    default: ''
  thinking:
    description: 'Thinking level: off, minimal, low, medium, high, xhigh, max'
    required: false
    default: ''
  api_key:
    description: 'Provider API key (can also be passed via provider-specific env vars)'
    required: false
    default: ''

  # --- 工具与权限控制 ---
  tools:
    description: 'Comma-separated allowlist of tool names. Include bash if the agent may use GitHub CLI.'
    required: false
    default: ''
  exclude_tools:
    description: 'Comma-separated denylist of tool names to disable'
    required: false
    default: ''
  no_builtin_tools:
    description: 'Disable built-in tools (true/false)'
    required: false
    default: 'false'
  no_tools:
    description: 'Disable all tools by default (true/false)'
    required: false
    default: 'false'

  # --- GitHub 认证与运行环境 ---
  github_token:
    description: 'GitHub token exposed as GH_TOKEN when bash tool is enabled'
    required: false
    default: ${{ github.token }}
  pi_version:
    description: 'Version of @earendil-works/pi-coding-agent to install (default: 1.4.0, or latest)'
    required: false
    default: '1.4.0'

  # --- 输出与格式 ---
  mode:
    description: 'Output mode: text (default) or json'
    required: false
    default: 'text'
  result_file:
    description: 'Optional file path to save the raw Pi output'
    required: false
    default: ''
  write_summary:
    description: 'Whether to append output to GITHUB_STEP_SUMMARY (true/false)'
    required: false
    default: 'true'

outputs:
  result:
    description: 'Agent output text (truncated to 32KB if oversized)'
    value: ${{ steps.run_pi.outputs.result }}
  result_file:
    description: 'Path to the file containing the full raw output'
    value: ${{ steps.run_pi.outputs.result_file }}
  exit_code:
    description: 'Process exit code of the Pi execution'
    value: ${{ steps.run_pi.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Cache Pi CLI installation
      id: cache_pi
      uses: actions/cache@v4
      with:
        path: |
          ~/.pi-cli
          ~/.npm
        key: pi-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pi_version }}
        restore-keys: |
          pi-cli-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Pi Coding Agent
      shell: bash
      env:
        PI_VERSION: ${{ inputs.pi_version }}
      run: |
        export PATH="$HOME/.pi-cli/bin:$PATH"
        echo "$HOME/.pi-cli/bin" >> "$GITHUB_PATH"
        if [ -x "$HOME/.pi-cli/bin/pi" ]; then
          INSTALLED_VER=$("$HOME/.pi-cli/bin/pi" --version 2>/dev/null || true)
          if [ "$PI_VERSION" != "latest" ] && [ "$INSTALLED_VER" = "$PI_VERSION" ]; then
            echo "Using cached Pi CLI v${INSTALLED_VER}"
            exit 0
          fi
        fi
        if command -v pi >/dev/null 2>&1 && [ "$PI_VERSION" = "latest" ]; then
          echo "Using pre-installed Pi CLI $(pi --version 2>/dev/null || true)"
          exit 0
        fi
        mkdir -p "$HOME/.pi-cli"
        npm install -g --prefix "$HOME/.pi-cli" --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"

    - name: Setup Pi Configuration and Extensions
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "${ACTION_PATH}/scripts/setup-pi-config.mjs"

    - name: Run Pi Agent
      id: run_pi
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_APPEND_SYSTEM_PROMPT: ${{ inputs.append_system_prompt }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THINKING: ${{ inputs.thinking }}
        INPUT_TOOLS: ${{ inputs.tools }}
        INPUT_EXCLUDE_TOOLS: ${{ inputs.exclude_tools }}
        INPUT_NO_BUILTIN_TOOLS: ${{ inputs.no_builtin_tools }}
        INPUT_NO_TOOLS: ${{ inputs.no_tools }}
        INPUT_PROMPT_TEMPLATE: ${{ inputs.prompt_template }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONTEXT_FILES: ${{ inputs.context_files }}
        INPUT_RESULT_FILE: ${{ inputs.result_file }}
        INPUT_WRITE_SUMMARY: ${{ inputs.write_summary }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        node "${ACTION_PATH}/scripts/run-agent.mjs"
