name: 'Pi Coding Agent Action'
description: 'Automated AI workflows and code tasks powered by Pi Coding Agent with full parameterization'
author: 'agentic-action'

inputs:
  # --- 提示词与任务指令 ---
  prompt:
    description: 'Main prompt or task message to execute (can be inline text or a file path)'
    required: true
  system_prompt:
    description: 'Override system prompt (can be inline text or a file path)'
    required: false
    default: ''
  append_system_prompt:
    description: 'Append text or file path to system prompt'
    required: false
    default: ''
  context_files:
    description: 'Space-separated list of file paths to prepend with @ (e.g. "diff.patch doc.md")'
    required: false
    default: ''
  prompt_template:
    description: 'Path to a prompt template file or directory'
    required: false
    default: ''

  # --- 模型与 Provider 配置 ---
  model:
    description: 'Model identifier (e.g. gpt-4o, claude-3-7-sonnet, gemini-2.5-pro, or provider/model)'
    required: true
  provider:
    description: 'Provider name (e.g. half-cabbage, google, openai, anthropic)'
    required: false
    default: ''
  thinking:
    description: 'Thinking level: off, minimal, low, medium, high, xhigh, max'
    required: false
    default: ''
  api_key:
    description: 'Provider API key (can also be passed via provider-specific env vars)'
    required: false
    default: ''

  # --- 工具与权限控制 ---
  tools:
    description: 'Comma-separated allowlist of tool names. Include bash if the agent may use GitHub CLI.'
    required: false
    default: ''
  exclude_tools:
    description: 'Comma-separated denylist of tool names to disable'
    required: false
    default: ''
  no_builtin_tools:
    description: 'Disable built-in tools (true/false)'
    required: false
    default: 'false'
  no_tools:
    description: 'Disable all tools by default (true/false)'
    required: false
    default: 'false'

  # --- GitHub 认证与环境 ---
  github_token:
    description: 'GitHub token exposed as GH_TOKEN in the environment'
    required: false
    default: ${{ github.token }}

  # --- 输出与格式 ---
  mode:
    description: 'Output mode: text (default) or json'
    required: false
    default: 'text'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Cache npm global cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: pi-npm-cache-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          pi-npm-cache-${{ runner.os }}-

    - name: Install Pi Coding Agent
      shell: bash
      run: |
        if ! command -v pi >/dev/null 2>&1; then
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@latest
        fi

    - name: Setup Pi Configuration and Extensions
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        mkdir -p ~/.pi/agent/extensions
        CONFIG_DIR="${ACTION_PATH}/pi-config"
        if [ -d "$CONFIG_DIR" ]; then
          cp -r "$CONFIG_DIR/"* ~/.pi/agent/
        fi

    - name: Run Pi Agent
      id: run_pi
      shell: bash
      env:
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_APPEND_SYSTEM_PROMPT: ${{ inputs.append_system_prompt }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THINKING: ${{ inputs.thinking }}
        INPUT_TOOLS: ${{ inputs.tools }}
        INPUT_EXCLUDE_TOOLS: ${{ inputs.exclude_tools }}
        INPUT_NO_BUILTIN_TOOLS: ${{ inputs.no_builtin_tools }}
        INPUT_NO_TOOLS: ${{ inputs.no_tools }}
        INPUT_PROMPT_TEMPLATE: ${{ inputs.prompt_template }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONTEXT_FILES: ${{ inputs.context_files }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # 1. 基础运行参数：非交互式
        PI_ARGS=("-p")

        # 3. 动态追加 Provider 与 Model
        [ -n "$INPUT_PROVIDER" ] && PI_ARGS+=("--provider" "$INPUT_PROVIDER")
        [ -n "$INPUT_MODEL" ] && PI_ARGS+=("--model" "$INPUT_MODEL")
        [ -n "$INPUT_THINKING" ] && PI_ARGS+=("--thinking" "$INPUT_THINKING")
        [ -n "$INPUT_API_KEY" ] && PI_ARGS+=("--api-key" "$INPUT_API_KEY")

        # 4. 动态追加工具白名单与权限
        [ -n "$INPUT_TOOLS" ] && PI_ARGS+=("--tools" "$INPUT_TOOLS")
        [ -n "$INPUT_EXCLUDE_TOOLS" ] && PI_ARGS+=("--exclude-tools" "$INPUT_EXCLUDE_TOOLS")
        [ "$INPUT_NO_BUILTIN_TOOLS" = "true" ] && PI_ARGS+=("--no-builtin-tools")
        [ "$INPUT_NO_TOOLS" = "true" ] && PI_ARGS+=("--no-tools")

        # 5. 动态追加系统提示词与输出模式（自动识别内联文本或文件路径）
        ACTUAL_SYSTEM_PROMPT="$INPUT_SYSTEM_PROMPT"
        if [ -n "$INPUT_SYSTEM_PROMPT" ] && [ -f "$INPUT_SYSTEM_PROMPT" ]; then
          ACTUAL_SYSTEM_PROMPT=$(cat "$INPUT_SYSTEM_PROMPT")
        fi
        [ -n "$ACTUAL_SYSTEM_PROMPT" ] && PI_ARGS+=("--system-prompt" "$ACTUAL_SYSTEM_PROMPT")

        ACTUAL_APPEND_SYSTEM_PROMPT="$INPUT_APPEND_SYSTEM_PROMPT"
        if [ -n "$INPUT_APPEND_SYSTEM_PROMPT" ] && [ -f "$INPUT_APPEND_SYSTEM_PROMPT" ]; then
          ACTUAL_APPEND_SYSTEM_PROMPT=$(cat "$INPUT_APPEND_SYSTEM_PROMPT")
        fi
        [ -n "$ACTUAL_APPEND_SYSTEM_PROMPT" ] && PI_ARGS+=("--append-system-prompt" "$ACTUAL_APPEND_SYSTEM_PROMPT")

        [ -n "$INPUT_PROMPT_TEMPLATE" ] && PI_ARGS+=("--prompt-template" "$INPUT_PROMPT_TEMPLATE")
        [ -n "$INPUT_MODE" ] && PI_ARGS+=("--mode" "$INPUT_MODE")

        # 6. 解析主提示词（自动识别内联文本或文件路径）
        ACTUAL_PROMPT="$INPUT_PROMPT"
        if [ -n "$INPUT_PROMPT" ] && [ -f "$INPUT_PROMPT" ]; then
          ACTUAL_PROMPT=$(cat "$INPUT_PROMPT")
        fi

        # 7. 构建文件输入列表
        FILES=()
        if [ -n "$INPUT_CONTEXT_FILES" ]; then
          for file in $INPUT_CONTEXT_FILES; do
            if [ -f "$file" ]; then
              FILES+=("@$file")
            fi
          done
        fi

        # 8. 执行 Pi：stdout 写入 Step Summary，stderr 终端输出
        RESULT_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/pi-result.XXXXXX")
        echo "Executing: pi ${PI_ARGS[*]} ${FILES[*]} [prompt]"
        set +e
        pi "${PI_ARGS[@]}" "${FILES[@]}" "$ACTUAL_PROMPT" | tee "$RESULT_FILE"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "Pi execution exited with code $EXIT_CODE"
          rm -f "$RESULT_FILE"
          exit "$EXIT_CODE"
        fi

        # 9. 写入 GitHub Step Summary
        echo "## Pi Agent Output" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
        rm -f "$RESULT_FILE"
    
