name: 'Pi PR Review Action'
description: 'Local git merge-base diff review for large PRs with read-only sandbox, structured JSON report, marker-idempotent PR comment, and severity gate'
author: 'agentic-action'

inputs:
  # --- 模型与 Provider 配置 ---
  model:
    description: 'Model identifier (e.g. gpt-4o, claude-3-7-sonnet, minimax-m3, or provider/model)'
    required: true
  provider:
    description: 'Provider name (e.g. half-cabbage, google, openai, anthropic)'
    required: false
    default: ''
  thinking:
    description: 'Thinking level: off, minimal, low, medium, high, xhigh, max'
    required: false
    default: 'high'
  api_key:
    description: 'Provider API key (can also be passed via provider-specific env vars)'
    required: false
    default: ''

  # --- PR 与比对预算配置 ---
  pr_number:
    description: 'Pull request number (defaults to github.event.pull_request.number)'
    required: false
    default: ${{ github.event.pull_request.number }}
  base_sha:
    description: 'Base commit SHA or ref (defaults to github.event.pull_request.base.sha or queried via gh)'
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  max_chunks:
    description: 'Maximum number of diff chunks to review in this run (0 = unlimited)'
    required: false
    default: '0'
  max_chunk_lines:
    description: 'Max patch lines per chunk (default: 1500)'
    required: false
    default: '1500'
  max_chunk_bytes:
    description: 'Max patch bytes per chunk (default: 40960)'
    required: false
    default: '40960'
  max_file_bytes:
    description: 'Single file patch pagination threshold in bytes (default: 409600)'
    required: false
    default: '409600'
  exclude:
    description: 'Additional comma-separated glob patterns to exclude from review'
    required: false
    default: ''

  # --- 提示词与工具定制 ---
  prompt:
    description: 'Optional extra review instructions appended to the built-in review task'
    required: false
    default: ''
  system_prompt:
    description: 'Optional system prompt override'
    required: false
    default: ''
  append_system_prompt:
    description: 'Optional extra system prompt appended after the built-in PR review contract'
    required: false
    default: ''
  context_files:
    description: 'Optional context files to prepend with @'
    required: false
    default: ''
  tools:
    description: 'Allowed tools for the review agent (defaults to strictly read-only: read,grep,find,ls)'
    required: false
    default: 'read,grep,find,ls'
  exclude_tools:
    description: 'Comma-separated denylist of tool names to disable'
    required: false
    default: ''

  # --- 回评、门禁与产物 ---
  fail_on:
    description: 'Fail the action when findings meet or exceed this severity: none, low, medium, high, critical'
    required: false
    default: 'high'
  post_comment:
    description: 'Publish/update PR comment idempotently via HTML marker (true/false)'
    required: false
    default: 'true'
  comment_marker:
    description: 'HTML comment marker name for idempotent comment updates'
    required: false
    default: 'pi-review'
  upload_artifact:
    description: 'Upload review context and report as workflow artifact (true/false)'
    required: false
    default: 'true'
  artifact_name:
    description: 'Artifact name when upload_artifact is true'
    required: false
    default: 'pr-review-report'
  github_token:
    description: 'GitHub token for resolving base SHA and publishing PR comments (never exposed to read-only Pi subprocess)'
    required: false
    default: ${{ github.token }}
  pi_version:
    description: 'Version of @earendil-works/pi-coding-agent to install (default: 1.4.0, or latest)'
    required: false
    default: '1.4.0'

outputs:
  result:
    description: 'Rendered PR review Markdown comment'
    value: ${{ steps.review.outputs.result }}
  result_file:
    description: 'Path to the rendered comment Markdown file'
    value: ${{ steps.review.outputs.result_file }}
  report_file:
    description: 'Path to the normalized report.json file'
    value: ${{ steps.review.outputs.report_file }}
  comment_file:
    description: 'Path to the rendered review-comment.md file'
    value: ${{ steps.review.outputs.comment_file }}
  context_dir:
    description: 'Path to the generated review context directory'
    value: ${{ steps.review.outputs.context_dir }}
  verdict:
    description: 'Review verdict: approve, comment, request_changes, skipped, or error'
    value: ${{ steps.review.outputs.verdict }}
  findings_count:
    description: 'Total number of findings in the report'
    value: ${{ steps.review.outputs.findings_count }}
  exit_code:
    description: 'Exit code of the review gate (0 = passed/skipped, 1 = fail_on hit, 2 = invalid report)'
    value: ${{ steps.review.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Cache Pi CLI installation
      uses: actions/cache@v4
      with:
        path: |
          ~/.pi-cli
          ~/.npm
        key: pi-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.pi_version }}
        restore-keys: |
          pi-cli-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Pi Coding Agent
      shell: bash
      env:
        PI_VERSION: ${{ inputs.pi_version }}
      run: |
        export PATH="$HOME/.pi-cli/bin:$PATH"
        echo "$HOME/.pi-cli/bin" >> "$GITHUB_PATH"
        if [ -x "$HOME/.pi-cli/bin/pi" ]; then
          INSTALLED_VER=$("$HOME/.pi-cli/bin/pi" --version 2>/dev/null || true)
          if [ "$PI_VERSION" != "latest" ] && [ "$INSTALLED_VER" = "$PI_VERSION" ]; then
            echo "Using cached Pi CLI v${INSTALLED_VER}"
            exit 0
          fi
        fi
        if command -v pi >/dev/null 2>&1 && [ "$PI_VERSION" = "latest" ]; then
          echo "Using pre-installed Pi CLI $(pi --version 2>/dev/null || true)"
          exit 0
        fi
        mkdir -p "$HOME/.pi-cli"
        npm install -g --prefix "$HOME/.pi-cli" --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"

    - name: Setup Pi Configuration and Extensions
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/..
      run: |
        node "${ACTION_PATH}/scripts/setup-pi-config.mjs"

    - name: Run PR Review Pipeline
      id: review
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_THINKING: ${{ inputs.thinking }}
        INPUT_API_KEY: ${{ inputs.api_key }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_BASE_SHA: ${{ inputs.base_sha }}
        INPUT_MAX_CHUNKS: ${{ inputs.max_chunks }}
        INPUT_MAX_CHUNK_LINES: ${{ inputs.max_chunk_lines }}
        INPUT_MAX_CHUNK_BYTES: ${{ inputs.max_chunk_bytes }}
        INPUT_MAX_FILE_BYTES: ${{ inputs.max_file_bytes }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_APPEND_SYSTEM_PROMPT: ${{ inputs.append_system_prompt }}
        INPUT_CONTEXT_FILES: ${{ inputs.context_files }}
        INPUT_TOOLS: ${{ inputs.tools }}
        INPUT_EXCLUDE_TOOLS: ${{ inputs.exclude_tools }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_POST_COMMENT: ${{ inputs.post_comment }}
        INPUT_COMMENT_MARKER: ${{ inputs.comment_marker }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set +e
        node "${ACTION_ROOT}/scripts/pr-review/run-review.mjs"
        CODE=$?
        set -e
        echo "gate_code=${CODE}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload review artifacts
      if: always() && inputs.upload_artifact == 'true' && steps.review.outputs.context_dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ steps.review.outputs.context_dir }}
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: warn

    - name: Enforce review gate
      shell: bash
      env:
        GATE_CODE: ${{ steps.review.outputs.gate_code }}
      run: |
        if [ "${GATE_CODE:-0}" -ne 0 ]; then
          exit "${GATE_CODE}"
        fi
